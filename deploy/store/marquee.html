<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thought Coach marquee tile</title>
<style>
  html, body { margin:0; width:1400px; height:560px; overflow:hidden; }
  body { background:#121211; color:#f0efec; font-family:"Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column;
    justify-content:center; padding:0 110px; box-sizing:border-box; position:relative; }
  .brand { display:flex; align-items:center; gap:16px; font-weight:700; font-size:34px; margin-bottom:30px; }
  .mark { width:26px; height:26px; border-radius:6px; background:#3987e5; transform:rotate(45deg); }
  h1 { font-size:72px; line-height:1.08; margin:0 0 24px; letter-spacing:-.015em; }
  p { margin:0; color:#c3c2b7; font-size:28px; }
  .board { position:absolute; right:-140px; top:50%; width:460px; height:460px; margin-top:-230px; opacity:.09;
    background:conic-gradient(#f0efec 25%, transparent 0 50%, #f0efec 0 75%, transparent 0) 0 0 / 115px 115px; transform:rotate(-10deg); }
  .arrow { position:absolute; width:230px; height:14px; border-radius:7px; opacity:.95; }
  .arrow::after { content:""; position:absolute; right:-24px; top:-15px; border-left:36px solid currentColor; border-top:22px solid transparent; border-bottom:22px solid transparent; }
  .a1 { right:150px; top:300px; background:#3fa95c; color:#3fa95c; transform:rotate(-35deg); }
  .a2 { right:120px; top:190px; background:#3987e5; color:#3987e5; transform:rotate(20deg); width:170px; }
</style>
</head>
<body>
  <div class="board"></div><div class="arrow a1"></div><div class="arrow a2"></div>
  <div class="brand"><span class="mark"></span>Thought Coach</div>
  <h1>Review how you think,<br>not just what you played.</h1>
  <p>Your lichess thinking, checked by Stockfish after the game.</p>
</body>
</html>
