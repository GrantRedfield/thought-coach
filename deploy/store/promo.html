<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thought Coach promo tile</title>
<style>
  html, body { margin:0; width:440px; height:280px; overflow:hidden; }
  body { background:#121211; color:#f0efec; font-family:"Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column;
    justify-content:center; padding:0 34px; box-sizing:border-box; position:relative; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:16px; }
  .mark { width:16px; height:16px; border-radius:4px; background:#3987e5; transform:rotate(45deg); }
  h1 { font-size:30px; line-height:1.12; margin:0 0 12px; letter-spacing:-.01em; }
  p { margin:0; color:#c3c2b7; font-size:15px; }
  .board { position:absolute; right:-40px; bottom:-40px; width:170px; height:170px; opacity:.16;
    background:conic-gradient(#f0efec 25%, transparent 0 50%, #f0efec 0 75%, transparent 0) 0 0 / 42.5px 42.5px; transform:rotate(-12deg); }
  .arrow { position:absolute; right:52px; bottom:58px; width:92px; height:6px; background:#3fa95c; border-radius:3px; transform:rotate(-38deg); opacity:.9; }
  .arrow::after { content:""; position:absolute; right:-10px; top:-7px; border-left:16px solid #3fa95c; border-top:10px solid transparent; border-bottom:10px solid transparent; }
</style>
</head>
<body>
  <div class="board"></div><div class="arrow"></div>
  <div class="brand"><span class="mark"></span>Thought Coach</div>
  <h1>Review how you think,<br>not just what you played.</h1>
  <p>For your lichess games, after they end</p>
</body>
</html>
